[Distribution]
Distribution=debian
Repositories=contrib,non-free,non-free-firmware

[Content]
# minimal system
Packages=
        ?priority(important)
        apt
        dbus-broker
        dbus-user-session
        login
        passwd
        sudo
        ca-certificates
        tzdata
        linux-image-generic
        firmware-linux-free
        firmware-linux-nonfree
        firmware-iwlwifi
        firmware-realtek
        firmware-mediatek
        firmware-atheros
        firmware-nvidia-graphics
        firmware-cirrus
        firmware-ti-connectivity
        wireless-regdb
        network-manager
        wpasupplicant
        libnss-systemd
        systemd-timesyncd
        polkitd
        zstd
        console-setup
        p11-kit
        locales
        locales-all
        systemd-zram-generator
# boot stack
        btrfs-progs
        dosfstools
        cryptsetup
        dracut
        plymouth
        plymouth-themes
        plymouth-label
        libtss2-tcti-device0t64
        systemd-boot
        systemd-boot-efi
        systemd-cryptsetup
        systemd-ukify
        tpm2-tools

[Output]
OciAnnotations=org.opencontainers.image.title=debian
               "org.opencontainers.image.description=Debian is a Linux distribution that's composed entirely of free and open-source software."
