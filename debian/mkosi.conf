[Distribution]
Distribution=debian
Repositories=contrib,non-free,non-free-firmware

[Content]
# minimal system, no meta-package on debian
Packages=
        apt
        dbus
        iproute2
        login
        passwd
        sudo
        systemd-sysv
        udev
# boot stack
        btrfs-progs
        cryptsetup
        dracut
        libtss2-tcti-device0t64
        systemd-boot
        systemd-boot-efi
        systemd-cryptsetup
        systemd-ukify
        tpm2-tools
# universal package managers
        flatpak
        snapd

[Output]
OciAnnotations=org.opencontainers.image.title=debian
               "org.opencontainers.image.description=Debian is a Linux distribution that's composed entirely of free and open-source software."
