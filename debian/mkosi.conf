[Distribution]
Distribution=debian
Repositories=contrib,non-free,non-free-firmware

[Content]
# minimal system, no meta-package on debian
Packages=
        apt
        dbus
        iproute2
        login
        passwd
        sudo
        systemd-sysv
        udev
        linux-image-generic
        firmware-linux-free
        firmware-linux-nonfree
        firmware-iwlwifi
        firmware-realtek
        firmware-mediatek
        firmware-atheros
        firmware-nvidia-graphics
        network-manager
        wpasupplicant
        libnss-systemd
        systemd-timesyncd
        polkitd
        linux-sysctl-defaults
        zstd
        console-setup
        p11-kit
        locales
        locales-all
# boot stack
        btrfs-progs
        dosfstools
        cryptsetup
        dracut
        plymouth
        libtss2-tcti-device0t64
        systemd-boot
        systemd-boot-efi
        systemd-cryptsetup
        systemd-ukify
        tpm2-tools
# universal package managers
        flatpak
        snapd

[Output]
OciAnnotations=org.opencontainers.image.title=debian
               "org.opencontainers.image.description=Debian is a Linux distribution that's composed entirely of free and open-source software."
