[Distribution]
Distribution=ubuntu
Repositories=restricted,universe,multiverse

[Content]
Packages=
        apt
        ubuntu-minimal
# boot stack
        btrfs-progs
        cryptsetup
        dracut
        libtss2-tcti-device0t64
        systemd-boot
        systemd-boot-efi
        systemd-cryptsetup
        systemd-ukify
        tpm2-tools
# universal package managers
        flatpak
        snapd
PostInstallationScripts=%C/apt-backports.postinst
