[Distribution]
Distribution=ubuntu
Repositories=restricted,universe,multiverse

[Content]
Packages=
        apt
        ubuntu-minimal
        linux-image-generic
        network-manager
        wpasupplicant
        systemd-resolved
        libnss-systemd
        polkitd
        linux-sysctl-defaults
        systemd-hwe-hwdb
        zstd
        p11-kit
# boot stack
        btrfs-progs
        dosfstools
        cryptsetup
        dracut
        plymouth
        libtss2-tcti-device0t64
        systemd-boot
        systemd-boot-efi
        systemd-cryptsetup
        systemd-ukify
        tpm2-tools
# universal package managers
        flatpak
        snapd
PostInstallationScripts=%C/apt-backports.postinst

[Output]
OciAnnotations=org.opencontainers.image.title=ubuntu
               "org.opencontainers.image.description=Ubuntu is a Debian-based Linux operating system based on free software."
