contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - systemd-repart-standalone
    - btrfs-progs
    - dosfstools
    - mtools

accounts:
  run-as: 0

entrypoint:
  command: /usr/bin/systemd-repart
cmd: --help

environment:
  PATH: /usr/sbin:/usr/bin:/sbin:/bin
  SYSTEMD_PAGER: cat

annotations:
  org.opencontainers.image.title: systemd-repart
  org.opencontainers.image.description: systemd-repart and mkfs, pinned, for writing slipspace disk images
  org.opencontainers.image.source: https://github.com/slipspace-infra/system-images
  org.opencontainers.image.url: https://github.com/slipspace-infra/system-images
  org.opencontainers.image.vendor: slipspace
