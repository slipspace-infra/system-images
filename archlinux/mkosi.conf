[Distribution]
Distribution=arch

[Content]
# minimal system
Packages=
        base
        linux
        linux-firmware
        sof-firmware
        wireless-regdb
        intel-ucode
        amd-ucode
        networkmanager
        wpa_supplicant
        sudo
        less
        nano
        vim
        ex-vi-compat
        polkit
        glibc-locales
        zram-generator
# boot stack, systemd-boot ships in systemd, plymouth ships all themes
        btrfs-progs
        dosfstools
        cryptsetup
        dracut
        plymouth
        systemd-ukify
        tpm2-tools
        tpm2-tss

[Build]
# dracut's pacman hook skips itself when this is set, else it writes /boot/initramfs-linux.img
Environment=KERNEL_INSTALL_INITRD_GENERATOR=dracut

[Output]
OciAnnotations=org.opencontainers.image.title=archlinux
               "org.opencontainers.image.description=Arch Linux is a lightweight and flexible Linux distribution that tries to Keep It Simple."
