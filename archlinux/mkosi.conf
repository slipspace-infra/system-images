[Distribution]
Distribution=arch

[Content]
# minimal system
Packages=
        base
        linux
        linux-firmware
        sof-firmware
        intel-ucode
        amd-ucode
        networkmanager
        wpa_supplicant
        sudo
        polkit
        glibc-locales
        zram-generator
# boot stack, systemd-boot ships in systemd
        btrfs-progs
        dosfstools
        cryptsetup
        dracut
        plymouth
        systemd-ukify
        tpm2-tools
        tpm2-tss

[Output]
OciAnnotations=org.opencontainers.image.title=archlinux
               "org.opencontainers.image.description=Arch Linux is a lightweight and flexible Linux distribution that tries to Keep It Simple."
