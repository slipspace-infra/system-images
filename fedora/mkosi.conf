[Distribution]
Distribution=fedora

[Content]
# minimal system
Packages=
        @core
        chrony
        nano
        @networkmanager-submodules
        systemd-pam
        cracklib-dicts
        p11-kit-server
        kernel
        linux-firmware
        @hardware-support
        glibc-all-langpacks
# boot stack
        btrfs-progs
        dosfstools
        cryptsetup
        dracut
        plymouth
        plymouth-theme-spinner
        plymouth-plugin-label
        systemd-boot-unsigned
        systemd-ukify
        tpm2-tools
        tpm2-tss
# no rescue initrds
RemovePackages=dracut-config-rescue
PostInstallationScripts=%C/selinux.postinst.chroot

[Output]
OciAnnotations=org.opencontainers.image.title=fedora
               "org.opencontainers.image.description=Fedora is a Linux distribution developed by the Fedora Project."
