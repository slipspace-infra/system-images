[Distribution]
Distribution=fedora

[Content]
# minimal system
Packages=
        @core
# boot stack
        btrfs-progs
        cryptsetup
        dracut
        plymouth
        systemd-boot-unsigned
        systemd-ukify
        tpm2-tools
        tpm2-tss
# universal package managers
        flatpak
        snapd
# no rescue initrds
RemovePackages=dracut-config-rescue
PostInstallationScripts=%C/snap.postinst.chroot

[Output]
OciAnnotations=org.opencontainers.image.title=fedora
               "org.opencontainers.image.description=Fedora is a Linux distribution developed by the Fedora Project."
