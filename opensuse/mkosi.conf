[Distribution]
Distribution=opensuse

[Content]
# minimal system
Packages=
        patterns-base-minimal_base
        zypper
        openSUSE-repos-Tumbleweed
        ca-certificates-mozilla
        procps
        less
        iproute2
        iputils
        vim-small
        nano
        e2fsprogs
        shadow
        timezone
        kernel-default
        kernel-firmware-all
        sof-firmware
        wireless-regdb
        NetworkManager
        wpa_supplicant
        sudo
        polkit
        p11-kit
        zstd
        glibc-locale
        zram-generator
# boot stack
        btrfsprogs
        dosfstools
        cryptsetup
        dracut
        plymouth
        plymouth-theme-bgrt
        plymouth-plugin-label
        systemd-boot
        systemd-ukify
        tpm2.0-tools
        libtss2-tcti-device0

[Output]
OciAnnotations=org.opencontainers.image.title=opensuse
               "org.opencontainers.image.description=openSUSE is a Linux distribution developed by the openSUSE Project."
