# Builds the mkosi image from Dockerfile, which the system image workflows build in.
name: mkosi

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/mkosi.yml
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          push: true
          tags: ghcr.io/slipspace-infra/system-images/mkosi:latest
          provenance: false
          cache-from: type=registry,ref=ghcr.io/slipspace-infra/system-images/mkosi:buildcache
          cache-to: type=registry,ref=ghcr.io/slipspace-infra/system-images/mkosi:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
