name: archlinux

on:
  push:
    branches: [main]
    paths:
      - archlinux/**
      - common.conf
      - mkosi.extra/**
      - mkosi.finalize.chroot
      - .github/workflows/archlinux.yml
      - .github/workflows/system-images.yml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  system-images:
    uses: ./.github/workflows/system-images.yml
    secrets: inherit
    with:
      distro: archlinux
      channels: '["latest"]'
      # arch linux ships x86_64 only, arch linux arm is a separate project
      arches: '["amd64"]'
      tags: |
        {
          "latest": "latest,rolling"
        }
