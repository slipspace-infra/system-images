[Output]
Format=oci
CompressOutput=zstd
CompressLevel=19
OutputDirectory=mkosi.output
OciAnnotations=org.opencontainers.image.source=https://github.com/slipspace-infra/system-images
               org.opencontainers.image.url=https://github.com/slipspace-infra/system-images
               org.opencontainers.image.vendor=slipspace

[Content]
Bootable=no
WithDocs=yes
WithRecommends=no
Locale=en_US.UTF-8
# shared boot config and scripts
ExtraTrees=%D/../mkosi.extra
PostInstallationScripts=%D/../mkosi.postinst.chroot
FinalizeScripts=%D/../mkosi.finalize.chroot

[Build]
WithNetwork=yes
# no initrd or uki from kernel hooks: the builder makes ukis in stage, from the finished system
Environment=KERNEL_INSTALL_BYPASS=1 INITRD=No
# downloaded packages and repository metadata, reused by the next build. ci keeps it in the registry
PackageCacheDirectory=%D/mkosi.pkgcache
Incremental=yes
CacheDirectory=%D/mkosi.cache
